[project]
name = "pair-trade-backtest"
version = "0.1.0"
description = "Statistical pair-trade backtester with a formation/trading split"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
    "statsmodels",
    "matplotlib",
    "yfinance"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pair-trade-download = "pair_trade_backtest.download:main"
pair-trade-zscore-sweep = "pair_trade_backtest.zscore_sweep:main"
pair-trade-review = "pair_trade_backtest.review:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
